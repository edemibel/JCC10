<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12, 6"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Judicial Pillars & Scale -->
  <g filter="url(#shadow)">
    <!-- Base Pedestal -->
    <rect x="146" y="380" width="220" height="24" rx="6" fill="url(#goldGrad)"/>
    <rect x="176" y="360" width="160" height="20" rx="4" fill="#F8FAFC"/>
    
    <!-- Central Pillar -->
    <rect x="246" y="140" width="20" height="220" rx="3" fill="#F8FAFC"/>
    <circle cx="256" cy="130" r="18" fill="url(#goldGrad)"/>
    
    <!-- Beam (Balance Arm) -->
    <path d="M120 180 L256 160 L392 180" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Left Scale Pan -->
    <line x1="130" y1="185" x2="100" y2="250" stroke="#F8FAFC" stroke-width="3"/>
    <line x1="130" y1="185" x2="160" y2="250" stroke="#F8FAFC" stroke-width="3"/>
    <path d="M90 250 Q130 270 170 250 Z" fill="url(#goldGrad)"/>

    <!-- Right Scale Pan -->
    <line x1="382" y1="185" x2="352" y2="250" stroke="#F8FAFC" stroke-width="3"/>
    <line x1="382" y1="185" x2="412" y2="250" stroke="#F8FAFC" stroke-width="3"/>
    <path d="M342 250 Q382 270 422 250 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Text JCC 10 -->
  <text x="256" y="435" font-family="'Cinzel', 'Times New Roman', serif" font-size="34" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">JUZGADO 10</text>
  <text x="256" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">CIVIL Y COMERCIAL</text>
</svg>
